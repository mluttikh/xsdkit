[build-system]
# 1.9 writes the licence below as a PEP 639 expression, which is what PyPI shows.
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "xsdkit"
description = "A generic XSD reader: parse W3C XML Schema into a queryable schema component model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["xsd", "xml", "schema", "parser", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://mluttikh.github.io/xsdkit/"
Documentation = "https://mluttikh.github.io/xsdkit/"
Repository = "https://github.com/mluttikh/xsdkit"
Changelog = "https://github.com/mluttikh/xsdkit/releases"

[tool.maturin]
# `extension-module` links against libpython, which is correct for a wheel and
# wrong for `cargo test`. It lives behind its own feature so CI can lint and
# test the same crate without it.
features = ["pyo3/extension-module", "extension-module"]
module-name = "xsdkit._xsdkit"
python-source = "python"
include = ["python/xsdkit/*.pyi", "python/xsdkit/py.typed"]
# abi3 means one wheel per platform serves every supported Python.


[dependency-groups]
# What the tests import, and what CI and the release workflow install:
# `pip install --group test`. IPython is here because the notebook tests
# render through its own formatter rather than calling `_repr_html_`.
test = ["pytest>=8", "ipython>=8"]
# stubtest checks the stub against the built module.
typecheck = ["mypy>=2"]
dev = [{ include-group = "test" }, { include-group = "typecheck" }, "maturin>=1.9,<2.0"]
