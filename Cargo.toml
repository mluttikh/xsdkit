[package]
name = "xsdkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A generic XSD reader: parse W3C XML Schema into a queryable schema component model"
license = "MIT"
repository = "https://github.com/mluttikh/xsdkit"
keywords = ["xsd", "xml", "schema", "parser", "validation"]
categories = ["parser-implementations", "data-structures"]
readme = "README.md"

[lib]
# `cdylib` for the Python extension module; `rlib` so the Rust crate, tests and
# examples still build normally.
crate-type = ["cdylib", "rlib"]

[dependencies]
roxmltree = "0.20"
fxhash = "0.2.1"
indexmap = "2.14.0"
encoding_rs = "0.8.35"
oxsdatatypes = "0.2.3"
regex = "1.13.1"
regex-syntax = "0.8.11"
quick-xml = "0.41"

[dev-dependencies]
rstest = "0.25"
encoding_rs = "0.8.35"
roxmltree = "0.20"

[dependencies.pyo3]
version = "0.28"
default-features = false
optional = true
features = ["abi3-py39", "macros"]

[features]
default = []
python = ["dep:pyo3"]
# Linking against libpython is only correct when building an actual wheel;
# `cargo check`/`clippy`/`test` must not. maturin turns this on, CI does not.
extension-module = ["python", "pyo3/extension-module"]
# Reserved for later phases; see DESIGN.md §3.14.
#   validate = []   # streaming validator + PSVI       (P4)
#   units    = []   # unit binding extraction          (P5)
#
# The xml2arrow config generator is deliberately NOT a feature here: it is a
# separate package (`xsd2arrow`), so that reading a schema never drags in
# `arrow`. See DESIGN.md §3.0b.

[profile.release]
debug = true
