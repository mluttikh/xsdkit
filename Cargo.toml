[package]
name = "xsdkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A generic XSD reader: parse W3C XML Schema into a queryable schema component model"
license = "MIT"
repository = "https://github.com/mluttikh/xsdkit"
homepage = "https://mluttikh.github.io/xsdkit/"
documentation = "https://mluttikh.github.io/xsdkit/"
keywords = ["xsd", "xml", "schema", "parser", "validation"]
categories = ["parser-implementations", "data-structures"]
readme = "README.md"

[package.metadata.docs.rs]
# `extension-module` links libpython, which docs.rs cannot do.
features = ["serde"]

[lib]
# `cdylib` for the Python extension module; `rlib` so the Rust crate, tests and
# examples still build normally.
crate-type = ["cdylib", "rlib"]

# `cache` measures the `serde` feature, so it cannot build without it.
[[example]]
name = "cache"
required-features = ["serde"]

[dependencies]
roxmltree = "0.20"
fxhash = "0.2.1"
indexmap = "2.14.0"
encoding_rs = "0.8.35"
regex = "1.13.1"
regex-syntax = "0.8.11"
quick-xml = "0.41"

[dependencies.serde]
version = "1.0"
default-features = false
optional = true
features = ["derive", "alloc"]

[dev-dependencies]
rstest = "0.25"
serde_json = "1.0"
postcard = { version = "1.1", features = ["alloc"] }
encoding_rs = "0.8.35"
roxmltree = "0.20"

[dependencies.pyo3]
version = "0.28"
default-features = false
optional = true
features = ["abi3-py39", "macros"]

[features]
default = []
python = ["dep:pyo3"]
# Serialize a compiled `Schemas` and read it back, so a large schema is
# compiled once and loaded thereafter.
serde = ["dep:serde"]
# Linking against libpython is only correct when building an actual wheel;
# `cargo check`/`clippy`/`test` must not. maturin turns this on, CI does not.
extension-module = ["python", "pyo3/extension-module"]
# Generating a config for a particular downstream reader is deliberately NOT a
# feature here — it belongs in its own package, so that reading a schema never
# drags in that reader's dependencies. See DESIGN.md §3.0b.

[profile.release]
debug = true
