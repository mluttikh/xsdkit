name: Release

# Tagging is the trigger, and the tag is the version: `pyproject.toml` takes
# its version dynamically from `Cargo.toml`, so there is one number to bump
# and the guard below refuses a tag that disagrees with it.
#
# `workflow_dispatch` builds every wheel without publishing anything, which is
# how you check a platform matrix change before it is attached to a version
# that can never be reused.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A tag that does not match the manifest publishes a wheel whose
      # filename disagrees with its own metadata, and the version is burned
      # either way: PyPI and crates.io both refuse to reuse one.
      - name: Compare the tag with the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag: $tag   Cargo.toml: $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi

  sdist:
    name: Source distribution
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist

  wheels:
    name: Wheel (${{ matrix.label }})
    needs: guard
    runs-on: ${{ matrix.os }}
    # Every row above finishes in under three minutes. This bounds a hung
    # build, not a queued one — waiting for a runner is not job time, and
    # GitHub alone decides when to give up on that.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One wheel per platform, not per platform *and* Python version: the
      # extension is built against the stable ABI (`abi3-py310`), so a single
      # wheel serves 3.10 through whatever ships next.
      # `native: true` marks the rows whose wheel the runner that built it can
      # install, and those are tested here. The others — aarch64 cross-compiled
      # on x86_64, musl on a glibc runner, Intel macOS on Apple silicon — are
      # tested by `test-wheels` below, on a runner that can run them.
      #
      # Both macOS wheels are built on the arm64 runner. There is no hosted
      # free Intel macOS image any more — `macos-13` was retired, and a job
      # asking for it does not fail, it queues until GitHub gives up, which
      # is how it cost this release 45 minutes. Cross-compiling to
      # `x86_64-apple-darwin` needs no second runner: one Xcode SDK carries
      # both slices.
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, native: true }
          - { label: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto, native: false }
          - { label: musl-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, native: false }
          - { label: musl-aarch64, os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2, native: false }
          - { label: macos-x86_64, os: macos-latest, target: x86_64, manylinux: auto, native: false }
          - { label: macos-aarch64, os: macos-latest, target: aarch64, manylinux: auto, native: true }
          - { label: windows-x64, os: windows-latest, target: x64, manylinux: auto, native: true }
          - { label: windows-arm64, os: windows-11-arm, target: aarch64, manylinux: auto, native: true }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The Windows ARM image is newer than the others and cannot be relied on
      # to carry a Rust toolchain; the rest use the one their image ships.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os == 'windows-11-arm'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"
      # Building a wheel proves it links, not that it works. The suite is in
      # the checkout and the wheel is the thing users install, so run one
      # against the other. The rows that cannot run here are tested by
      # `test-wheels`.
      - name: Test the wheel it just built
        if: matrix.native
        shell: bash
        run: |
          python -m pip install --find-links dist --no-index xsdkit
          # The `test` dependency group, which needs pip 25.1 or later.
          python -m pip install --upgrade pip
          python -m pip install --group test
          # From a directory that is not the repo root, so the import resolves
          # to the installed wheel and not to `python/xsdkit`, which holds the
          # sources without the compiled extension.
          cd "$RUNNER_TEMP"
          python -c "import platform, xsdkit; print('testing', xsdkit.__version__, 'on', platform.machine(), 'from', xsdkit.__file__)"
          python -m pytest "$GITHUB_WORKSPACE/python/tests" -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.label }}
          path: dist

  # The wheels the runner that built them cannot run, each taken to one that
  # can: the aarch64 glibc wheel to an ARM runner, the musl wheels into Alpine
  # on the matching architecture, the Intel macOS wheel under Rosetta 2. So
  # every wheel PyPI receives has passed the suite, not merely linked.
  test-wheels:
    name: Test wheel (${{ matrix.label }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-aarch64, os: ubuntu-24.04-arm, how: native }
          - { label: musl-x86_64, os: ubuntu-latest, how: alpine }
          - { label: musl-aarch64, os: ubuntu-24.04-arm, how: alpine }
          # The x64 Python for macOS is a universal2 build, which starts its
          # arm64 half on Apple silicon — and pip then rightly refuses an
          # x86_64 wheel. `arch -x86_64` starts the other half, under Rosetta 2.
          - { label: macos-x86_64, os: macos-latest, how: native, architecture: x64, arch: "arch -x86_64" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.label }}
          path: dist
      - uses: actions/setup-python@v6
        if: matrix.how == 'native'
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - name: Test the wheel
        if: matrix.how == 'native'
        shell: bash
        run: |
          py="${{ matrix.arch }} python"
          $py -m pip install --find-links dist --no-index xsdkit
          $py -m pip install --upgrade pip
          $py -m pip install --group test
          cd "$RUNNER_TEMP"
          $py -c "import platform, xsdkit; print('testing', xsdkit.__version__, 'on', platform.machine(), 'from', xsdkit.__file__)"
          $py -m pytest "$GITHUB_WORKSPACE/python/tests" -q
      # A musl wheel needs a musl libc to load. Docker is on every hosted Ubuntu
      # runner, the ARM one included, whereas a job container would not do:
      # JavaScript actions cannot run inside Alpine on ARM. The build tools are
      # for any test dependency that has no musl wheel on that architecture.
      - name: Test the wheel in Alpine
        if: matrix.how == 'alpine'
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.14-alpine sh -euc '
            apk add --no-cache build-base linux-headers > /dev/null
            python -m pip install --root-user-action ignore --find-links dist --no-index xsdkit
            python -m pip install --root-user-action ignore --group test
            cd /tmp
            python -c "import platform, xsdkit; print(\"testing\", xsdkit.__version__, \"on\", platform.machine(), \"with musl\")"
            python -m pytest /io/python/tests -q -p no:cacheprovider
          '

  pypi:
    name: Publish to PyPI
    # Only a tag publishes. A manual run stops at the artifacts above, which
    # is the point of being able to trigger it manually.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sdist, wheels, test-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xsdkit
    permissions:
      # Trusted Publishing: the job mints a short-lived OIDC token per run and
      # there is no API token stored anywhere to leak.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # `pyproject.toml` advertises this page as the changelog, so it has to
      # exist and has to carry the artifacts.
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

# The crate is published by hand: `cargo publish` is irreversible — a version
# can be yanked but never deleted, and the name is claimed for good — so the
# first one gets a human. See the release checklist in AGENTS.md.
